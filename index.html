<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <title>Wetter Weiche</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body, iframe {
      width: 100%;
      height: 100%;
      border: none;
      overflow: hidden;
      background: #111;
    }
  </style>
</head>
<body>
  <iframe id="wetterFrame" src="https://embed.windy.com/embed2.html?lat=53.30&lon=7.70&detailLat=53.30&detailLon=7.70&width=650&height=450&zoom=9&level=surface&overlay=wind&product=ecmwf&menu=&message=&marker=&calendar=now&pressure=&type=forecast&location=coordinates&detail=true&metricWind=km%2Fh&radarRange=-1"></iframe>

  <script>
    // 1. Windkarte bei Sturm-/Windwarnung ab Stufe 2
    const urlWind = "https://embed.windy.com/embed2.html?lat=53.30&lon=7.70&detailLat=53.30&detailLon=7.70&zoom=9&level=surface&overlay=wind&product=iconEu&menu=&message=&marker=&calendar=now&pressure=&type=map&location=coordinates&detail=&metricWind=km%2Fh&radarRange=-1";
    
    // 2. Standard: Detaillierte Wettervorhersage (Stundenwerte, Wetterlage, Temperatur)
    const urlForecast = "https://embed.windy.com/embed2.html?lat=53.30&lon=7.70&detailLat=53.30&detailLon=7.70&width=650&height=450&zoom=9&level=surface&overlay=wind&product=ecmwf&menu=&message=&marker=&calendar=now&pressure=&type=forecast&location=coordinates&detail=true&metricWind=km%2Fh&radarRange=-1";

    const warnCellId = "103457022"; // Uplengen

    async function checkWeatherAlert() {
      try {
        const response = await fetch("https://maps.dwd.de/geoserver/dwd/ows?service=WFS&version=2.0.0&request=GetFeature&typeName=dwd:Warnungen_Gemeinden&outputFormat=application/json");
        const data = await response.json();
        
        let hasWindAlert = false;
        if (data && data.features) {
          for (const item of data.features) {
            const props = item.properties;
            if (props.WARNCELLID == warnCellId || props.NAME === "Gemeinde Uplengen") {
              const event = (props.EVENT || "").toLowerCase();
              const level = parseInt(props.LEVEL || "0");
              const isLevel2OrHigher = level >= 2 || props.SEVERITY === "Moderate" || props.SEVERITY === "Severe" || props.SEVERITY === "Extreme";
              const isWindEvent = event.includes("wind") || event.includes("sturm") || event.includes("böen") || event.includes("orkan");

              if (isWindEvent && isLevel2OrHigher) {
                hasWindAlert = true;
                break;
              }
            }
          }
        }

        const targetUrl = hasWindAlert ? urlWind : urlForecast;
        const frame = document.getElementById("wetterFrame");
        if (frame && frame.src !== targetUrl) {
          frame.src = targetUrl;
        }
      } catch (e) {
        console.error(e);
      }
    }

    checkWeatherAlert();
    setInterval(checkWeatherAlert, 3 * 60 * 1000);
  </script>
</body>
</html>
