<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <title>Wetter Uplengen</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      background: #1e2430;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      overflow: hidden;
    }
    #weatherView {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      height: 100%;
      padding: 18px 24px;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      border-bottom: 1px solid rgba(255,255,255,0.15);
      padding-bottom: 8px;
    }
    .city { font-size: 1.5rem; font-weight: 700; letter-spacing: 0.5px; }
    .condition { font-size: 1rem; color: #cbd5e1; }
    .current {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin: 10px 0;
    }
    .temp-big { font-size: 3.4rem; font-weight: 800; }
    .high-low { font-size: 1.1rem; color: #94a3b8; text-align: right; }
    .forecast-container {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      border-top: 1px solid rgba(255,255,255,0.15);
      padding-top: 12px;
    }
    .day-col {
      background: rgba(255, 255, 255, 0.05);
      border-radius: 8px;
      padding: 10px 6px;
      text-align: center;
    }
    .day-name { font-size: 0.95rem; font-weight: 600; margin-bottom: 4px; color: #e2e8f0; }
    .day-temp { font-size: 1rem; font-weight: 700; }
    .day-min { font-size: 0.85rem; color: #94a3b8; font-weight: normal; }
    #windFrame {
      display: none;
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>
<body>
  <div id="weatherView">
    <div class="header">
      <div class="city">Uplengen</div>
      <div id="conditionText" class="condition">Wetter lädt...</div>
    </div>

    <div class="current">
      <div id="currentTemp" class="temp-big">--°C</div>
      <div class="high-low">
        <div>Max: <span id="todayMax" style="color:#f87171">--°C</span></div>
        <div>Min: <span id="todayMin" style="color:#60a5fa">--°C</span></div>
      </div>
    </div>

    <div class="forecast-container" id="forecastDays"></div>
  </div>

  <iframe id="windFrame" src="about:blank"></iframe>

  <script>
    const urlWind = "https://embed.windy.com/embed2.html?lat=53.30&lon=7.70&detailLat=53.30&detailLon=7.70&zoom=9&level=surface&overlay=wind&product=iconEu&menu=&message=&marker=&calendar=now&pressure=&type=map&location=coordinates&detail=&metricWind=km%2Fh&radarRange=-1";
    const warnCellId = "103457022";

    const wmoCodes = {
      0: "Klar", 1: "Meist sonnig", 2: "Teils wolkig", 3: "Bedeckt",
      45: "Neblig", 48: "Reifnebel", 51: "Leichter Niesel", 53: "Nieselregen",
      55: "Starker Niesel", 61: "Leichter Regen", 63: "Regen", 65: "Starker Regen",
      71: "Leichter Schnee", 73: "Schneefall", 75: "Starker Schnee",
      80: "Leichte Schauer", 81: "Regenschauer", 82: "Heftige Schauer",
      95: "Gewitter", 96: "Gewitter m. Hagel"
    };

    async function loadSimpleWeather() {
      try {
        const res = await fetch("https://api.open-meteo.com/v1/forecast?latitude=53.30&longitude=7.70&current=temperature_2m,weather_code&daily=weather_code,temperature_2m_max,temperature_2m_min&timezone=Europe%2FBerlin");
        const data = await res.json();

        document.getElementById("currentTemp").innerText = Math.round(data.current.temperature_2m) + "°C";
        document.getElementById("conditionText").innerText = wmoCodes[data.current.weather_code] || "Bedeckt";
        document.getElementById("todayMax").innerText = Math.round(data.daily.temperature_2m_max[0]) + "°C";
        document.getElementById("todayMin").innerText = Math.round(data.daily.temperature_2m_min[0]) + "°C";

        const forecastDiv = document.getElementById("forecastDays");
        forecastDiv.innerHTML = "";
        
        for (let i = 1; i <= 3; i++) {
          const date = new Date(data.daily.time[i]);
          const dayName = date.toLocaleDateString("de-DE", { weekday: "short" });
          const max = Math.round(data.daily.temperature_2m_max[i]);
          const min = Math.round(data.daily.temperature_2m_min[i]);
          const text = wmoCodes[data.daily.weather_code[i]] || "";

          forecastDiv.innerHTML += `
            <div class="day-col">
              <div class="day-name">${dayName}</div>
              <div style="font-size:0.75rem; color:#cbd5e1; margin-bottom:4px;">${text}</div>
              <div class="day-temp">${max}° <span class="day-min">/ ${min}°</span></div>
            </div>
          `;
        }
      } catch (err) {
        console.error("Wetterdaten-Fehler:", err);
      }
    }

    async function checkAlerts() {
      let isWindAlert = false;
      try {
        const response = await fetch("https://maps.dwd.de/geoserver/dwd/ows?service=WFS&version=2.0.0&request=GetFeature&typeName=dwd:Warnungen_Gemeinden&outputFormat=application/json");
        const data = await response.json();

        if (data && data.features) {
          for (const item of data.features) {
            const props = item.properties;
            if (props.WARNCELLID == warnCellId || props.NAME === "Gemeinde Uplengen") {
              const event = (props.EVENT || "").toLowerCase();
              const level = parseInt(props.LEVEL || "0");
              const isLevel2OrHigher = level >= 2 || ["Moderate", "Severe", "Extreme"].includes(props.SEVERITY);
              const isWind = event.includes("wind") || event.includes("sturm") || event.includes("böen") || event.includes("orkan");

              if (isWind && isLevel2OrHigher) {
                isWindAlert = true;
                break;
              }
            }
          }
        }
      } catch (e) {
        isWindAlert = false;
      }

      const weatherView = document.getElementById("weatherView");
      const windFrame = document.getElementById("windFrame");

      if (isWindAlert) {
        weatherView.style.display = "none";
        windFrame.style.display = "block";
        if (windFrame.src !== urlWind) windFrame.src = urlWind;
      } else {
        windFrame.style.display = "none";
        weatherView.style.display = "flex";
      }
    }

    loadSimpleWeather();
    checkAlerts();
    setInterval(loadSimpleWeather, 15 * 60 * 1000);
    setInterval(checkAlerts, 3 * 60 * 1000);
  </script>
</body>
</html>
