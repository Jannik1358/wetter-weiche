<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <title>Wetter Uplengen</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #ffffff;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }
  </style>
</head>
<body>
  <iframe id="wetterFrame" src="https://www.meteoblue.com/de/wetter/widget/three/uplengen_deutschland_2821102?geoloc=fixed&nocurrent=0&noforecast=0&days=3&tempunit=CELSIUS&windunit=KILOMETER_PER_HOUR&layout=light"></iframe>

  <script>
    const urlMeteoblue = "https://www.meteoblue.com/de/wetter/widget/three/uplengen_deutschland_2821102?geoloc=fixed&nocurrent=0&noforecast=0&days=3&tempunit=CELSIUS&windunit=KILOMETER_PER_HOUR&layout=light";
    const urlWind = "https://embed.windy.com/embed2.html?lat=53.30&lon=7.70&detailLat=53.30&detailLon=7.70&zoom=9&level=surface&overlay=wind&product=iconEu&menu=&message=&marker=&calendar=now&pressure=&type=map&location=coordinates&detail=&metricWind=km%2Fh&radarRange=-1";
    const warnCellId = "103457022";

    async function checkWeatherAlert() {
      try {
        const response = await fetch("https://maps.dwd.de/geoserver/dwd/ows?service=WFS&version=2.0.0&request=GetFeature&typeName=dwd:Warnungen_Gemeinden&outputFormat=application/json");
        const data = await response.json();
        
        let hasWindAlert = false;
        if (data && data.features) {
          for (const item of data.features) {
            const props = item.properties;
            if (props.WARNCELLID == warnCellId || props.NAME === "Gemeinde Uplengen") {
              const event = (props.EVENT || "").toLowerCase();
              const level = parseInt(props.LEVEL || "0");
              const isLevel2OrHigher = level >= 2 || ["Moderate", "Severe", "Extreme"].includes(props.SEVERITY);
              const isWind = event.includes("wind") || event.includes("sturm") || event.includes("böen") || event.includes("orkan");

              if (isWind && isLevel2OrHigher) {
                hasWindAlert = true;
                break;
              }
            }
          }
        }

        const targetUrl = hasWindAlert ? urlWind : urlMeteoblue;
        const frame = document.getElementById("wetterFrame");
        if (frame && frame.src !== targetUrl) {
          frame.src = targetUrl;
        }
      } catch (e) {
        console.error(e);
      }
    }

    checkWeatherAlert();
    setInterval(checkWeatherAlert, 3 * 60 * 1000);
  </script>
</body>
</html>
