<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <title>Wetter Uplengen</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #101d36;
    }
    #widgetContainer {
      width: 100%;
      height: 100%;
      position: relative;
      overflow: hidden;
    }
    /* Passt Höhe, Breite und Zoomfaktor so an, dass auch die unteren Temperaturwerte sichtbar sind */
    #wetterFrame {
      width: 480px;
      height: 560px;
      border: none;
      position: absolute;
      top: 0;
      left: 0;
      transform-origin: top left;
      transform: scale(calc(100vw / 480));
    }
    #alertFrame {
      display: none;
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>
<body>
  <div id="widgetContainer">
    <!-- Feste Koordinaten für Uplengen (53.30N / 7.70E) ohne automatische IP-Standorterkennung -->
    <iframe id="wetterFrame" src="https://www.meteoblue.com/de/wetter/widget/three?lat=53.30&lon=7.70&name=Uplengen&geoloc=fixed&nocurrent=0&noforecast=0&days=3&tempunit=CELSIUS&windunit=KILOMETER_PER_HOUR&layout=dark" scrolling="no" frameborder="0"></iframe>
  </div>

  <iframe id="alertFrame" src="about:blank"></iframe>

  <script>
    // Feste Meteoblue-URL mit Lat/Lon und erzwungenem Ortsnamen Uplengen
    const urlMeteoblue = "https://www.meteoblue.com/de/wetter/widget/three?lat=53.30&lon=7.70&name=Uplengen&geoloc=fixed&nocurrent=0&noforecast=0&days=3&tempunit=CELSIUS&windunit=KILOMETER_PER_HOUR&layout=dark";
    
    // 1. Sturm/Wind-Karte (Windy)
    const urlWind = "https://embed.windy.com/embed2.html?lat=53.30&lon=7.70&detailLat=53.30&detailLon=7.70&zoom=9&level=surface&overlay=wind&product=iconEu&menu=&message=&marker=&calendar=now&pressure=&type=map&location=coordinates&detail=&metricWind=km%2Fh&radarRange=-1";
    
    // 2. Blitz-/Unwetter-Radar (Windy Live-Blitze)
    const urlLightning = "https://embed.windy.com/embed2.html?lat=53.30&lon=7.70&detailLat=53.30&detailLon=7.70&zoom=9&level=surface&overlay=radar&product=radar&menu=&message=&marker=&calendar=now&pressure=&type=map&location=coordinates&detail=&metricWind=km%2Fh&radarRange=-1";

    const warnCellId = "103457022"; // Uplengen

    async function checkWeatherAlert() {
      try {
        const response = await fetch("https://maps.dwd.de/geoserver/dwd/ows?service=WFS&version=2.0.0&request=GetFeature&typeName=dwd:Warnungen_Gemeinden&outputFormat=application/json");
        const data = await response.json();
        
        let hasWindAlert = false;
        let hasThunderAlert = false;

        if (data && data.features) {
          for (const item of data.features) {
            const props = item.properties;
            if (props.WARNCELLID == warnCellId || props.NAME === "Gemeinde Uplengen") {
              const event = (props.EVENT || "").toLowerCase();
              const level = parseInt(props.LEVEL || "0");
              const isLevel2OrHigher = level >= 2 || ["Moderate", "Severe", "Extreme"].includes(props.SEVERITY);

              if (isLevel2OrHigher) {
                if (event.includes("gewitter") || event.includes("blitz") || event.includes("hagel") || event.includes("unwetter")) {
                  hasThunderAlert = true;
                }
                if (event.includes("wind") || event.includes("sturm") || event.includes("böen") || event.includes("orkan")) {
                  hasWindAlert = true;
                }
              }
            }
          }
        }

        const widgetContainer = document.getElementById("widgetContainer");
        const alertFrame = document.getElementById("alertFrame");

        if (hasThunderAlert) {
          widgetContainer.style.display = "none";
          alertFrame.style.display = "block";
          if (alertFrame.src !== urlLightning) alertFrame.src = urlLightning;
        } else if (hasWindAlert) {
          widgetContainer.style.display = "none";
          alertFrame.style.display = "block";
          if (alertFrame.src !== urlWind) alertFrame.src = urlWind;
        } else {
          alertFrame.style.display = "none";
          widgetContainer.style.display = "block";
        }
      } catch (e) {
        console.error(e);
      }
    }

    checkWeatherAlert();
    setInterval(checkWeatherAlert, 3 * 60 * 1000);
  </script>
</body>
</html>
